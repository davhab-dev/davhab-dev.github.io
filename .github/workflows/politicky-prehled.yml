name: Politicky prehled - manual recovery
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: politics-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load canonical application source
        uses: actions/checkout@v4
        with:
          repository: davhab-dev/Politicky-prehled
          ref: main
          path: .politicky-prehled-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve published editions
        run: |
          rsync -a politicky-prehled/archive/ .politicky-prehled-source/archive/
          cp politicky-prehled/data.json .politicky-prehled-source/data.json
      - name: Check application
        run: |
          python -m unittest discover -s .politicky-prehled-source/scripts -p 'test_update_politics.py'
          node --check .politicky-prehled-source/app.js
      - name: Fetch current articles
        run: python .politicky-prehled-source/scripts/collect_cycle.py politicky-prehled
      - name: Save latest edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add politicky-prehled
          git diff --cached --quiet && exit 0
          git commit -m 'Obnov Politický přehled ze samostatného repozitáře'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish refreshed edition on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
