name: Politicky prehled - hourly without AI
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/politicky-prehled.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: politics-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load canonical application source
        uses: actions/checkout@v4
        with:
          repository: davhab-dev/Politicky-prehled
          ref: main
          path: .politicky-prehled-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve published editions
        run: |
          rsync -a politicky-prehled/archive/ .politicky-prehled-source/archive/
          cp politicky-prehled/data.json .politicky-prehled-source/data.json
      - name: Validate application syntax
        run: node --check .politicky-prehled-source/app.js
      - name: Fetch current articles
        run: python .politicky-prehled-source/scripts/collect_cycle.py politicky-prehled
      - name: Validate HTML and JSON consistency
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          page=Path('politicky-prehled/index.html').read_text()
          data=json.loads(Path('politicky-prehled/data.json').read_text())
          match=re.search(r'<script id="initial-data" type="application/json">(.*?)</script>', page, re.S)
          assert match and json.loads(match.group(1)) == data, 'Published HTML / data.json mismatch'
          PY
      - name: Save latest edition
        id: save
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add politicky-prehled
          if git diff --cached --quiet; then
            echo 'Bez změn – publikace není nutná'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Obnov Politický přehled ze samostatného repozitáře'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger Pages builds automatically.
      - name: Publish refreshed edition on GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
