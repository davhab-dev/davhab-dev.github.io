name: Aktualizace Cyklistickeho prehledu
on:
  push:
    branches: [main]
    paths:
      - scripts/update_cycling.py
      - .github/workflows/cycling-rss.yml
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cycling-rss-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stahnout RSS a vytvorit JSON
        run: python3 scripts/update_cycling.py
      - name: Ulozit zmeny
        id: save
        run: |
          git add cyklisticky-prehled/articles.json
          if git diff --cached --quiet; then
            echo "Bez zmen"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualizace cyklistickych clanku"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger Pages builds automatically.
      - name: Publikovat aktualni cyklisticky prehled
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
